name: gatex
description: "GateX VPN"
publish_to: 'none'
version: 1.2.2+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  window_manager: ^0.5.2
  tray_manager: 0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/tray/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
