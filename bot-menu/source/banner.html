<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root {
  --bg: #06110e; --bg-2: #0d241c;
  --text: #eaf5f0; --muted: #9db6ad;
  --accent: #2ee6a6; --accent-2: #18b98a;
  --line: rgba(255,255,255,.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 480px; overflow: hidden; background: var(--bg); }
body { font-family: "Manrope", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
.b {
  position: relative; width: 1280px; height: 480px; overflow: hidden;
  background:
    radial-gradient(520px 380px at 8% -10%, rgba(46,230,166,.30), transparent 70%),
    radial-gradient(560px 420px at 92% 120%, rgba(19,92,120,.50), transparent 70%),
    radial-gradient(420px 320px at 78% 30%, rgba(31,167,122,.22), transparent 70%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 70%);
}
/* faint grid, fades out to the left */
.grid { position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 48px 48px; background-position: -1px -1px;
  -webkit-mask-image: linear-gradient(90deg, transparent 20%, #000 75%); }
.rings { position: absolute; right: 70px; top: 50%; width: 560px; height: 560px; transform: translateY(-50%); }
.rings i { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(46,230,166,.16); }
.rings i:nth-child(2) { inset: 70px; border-color: rgba(46,230,166,.22); }
.rings i:nth-child(3) { inset: 140px; border-color: rgba(255,255,255,.10); border-style: dashed; }
.dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px 4px rgba(46,230,166,.6); }

.brand { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 16px;
  font: 600 30px/1 "Unbounded", sans-serif; letter-spacing: -.01em; }
.brand b { color: var(--accent); font-weight: 600; }
.mini { width: 58px; height: 58px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.mini svg { width: 100%; height: 100%; display: block; }

.copy { position: absolute; left: 72px; top: 175px; width: 640px; }
h1 { font: 600 76px/1.04 "Unbounded", sans-serif; letter-spacing: -.025em; }
h1 em { font-style: normal; color: var(--accent); }
p.sub { margin-top: 22px; font: 700 38px/1.28 "Manrope", sans-serif; color: var(--muted); }

.tile { position: absolute; right: 200px; top: 50%; width: 280px; height: 280px; transform: translateY(-50%);
  border-radius: 84px; display: grid; place-items: center;
  background: linear-gradient(150deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 55%, rgba(255,255,255,.08));
  border: 2px solid rgba(255,255,255,.16);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 30px 80px rgba(0,0,0,.45), 0 0 120px rgba(46,230,166,.18); }
.tile svg.ic { width: 150px; height: 150px; filter: drop-shadow(0 0 14px rgba(46,230,166,.55)); }
.tile .badge { position: absolute; right: -26px; top: -18px; padding: 12px 20px; border-radius: 999px;
  background: var(--accent); color: #03241a; font: 800 26px/1 "Manrope", sans-serif; box-shadow: 0 10px 30px rgba(46,230,166,.35); }

/* main banner */
.main .logo { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 300px; height: 300px; border-radius: 92px; overflow: hidden;
  border: 2px solid rgba(255,255,255,.14); box-shadow: 0 30px 90px rgba(0,0,0,.5), 0 0 140px rgba(46,230,166,.22); }
.main .logo svg { width: 100%; height: 100%; display: block; }
.main .copy { left: 430px; top: 92px; width: 800px; }
.main h1 { font-size: 104px; letter-spacing: -.03em; }
.main p.sub { font-size: 42px; color: var(--text); opacity: .86; margin-top: 18px; }
.chips { display: flex; gap: 14px; margin-top: 30px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; font: 700 30px/1 "Manrope", sans-serif;
  background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); }
.chip::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(46,230,166,.8); }
.main .rings { right: -150px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="mintS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dfbd2"/><stop offset="1" stop-color="#18b98a"/></linearGradient>
  </defs>
</svg>
<div id="root"></div>
<script>
const LOGO = `<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e271e"/><stop offset="1" stop-color="#050e0b"/></linearGradient>
  <radialGradient id="lA" cx="150" cy="120" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2ee6a6" stop-opacity=".55"/><stop offset="1" stop-color="#2ee6a6" stop-opacity="0"/></radialGradient>
  <radialGradient id="lB" cx="400" cy="420" r="240" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0f8f68" stop-opacity=".5"/><stop offset="1" stop-color="#0f8f68" stop-opacity="0"/></radialGradient>
  <linearGradient id="lglass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".55" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
  <linearGradient id="ledge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#2ee6a6" stop-opacity=".45"/></linearGradient>
  <linearGradient id="lG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfeee2"/></linearGradient>
  <linearGradient id="lX" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6dfacb"/><stop offset="1" stop-color="#18b98a"/></linearGradient>
  <filter id="lneon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="512" height="512" fill="url(#lbg)"/><rect width="512" height="512" fill="url(#lA)"/><rect width="512" height="512" fill="url(#lB)"/>
<rect x="60" y="60" width="392" height="392" rx="116" fill="url(#lglass)"/>
<rect x="61" y="61" width="390" height="390" rx="115" fill="none" stroke="url(#ledge)" stroke-width="2"/>
<g transform="translate(105.06 314.66) scale(0.1564 -0.1564)">
<path d="M512.0 242.0H717.53Q714.19 237.4 710.5 233.0Q677.0 193.0 621.0 172.5Q565.0 152.0 492.0 152.0Q417.0 152.0 361.5 177.0Q306.0 202.0 276.0 252.0Q246.0 302.0 246.0 375.0Q246.0 447.0 274.0 495.5Q302.0 544.0 353.0 568.5Q404.0 593.0 474.0 593.0Q532.0 593.0 577.5 578.5Q623.0 564.0 653.5 536.5Q684.0 509.0 694.0 471.0H903.0Q887.0 558.0 832.0 624.0Q777.0 690.0 687.0 728.0Q597.0 766.0 473.0 766.0Q380.0 766.0 301.5 740.5Q223.0 715.0 163.5 665.0Q104.0 615.0 71.0 542.0Q38.0 469.0 38.0 375.0Q38.0 281.0 70.5 208.0Q103.0 135.0 161.5 85.0Q220.0 35.0 297.0 9.5Q374.0 -16.0 462.0 -16.0Q554.0 -16.0 623.5 11.0Q693.0 38.0 739.5 86.0Q746.58 93.31 753.15 100.92L763.0 0.0H910.0V388.0H512.0Z" fill="none" stroke-width="51.1" stroke-linejoin="round" stroke="url(#lG)"/>
<g filter="url(#lneon)"><path transform="translate(1011.0 0)" d="M564.43 389.69 860.0 750.0H605.0L438.65 532.29L270.0 750.0H11.0L308.06 389.77L-11.0 0.0H241.0L433.9 248.23L626.0 0.0H881.0L564.43 389.69Z" fill="none" stroke-width="51.1" stroke-linejoin="round" stroke="url(#lX)"/></g>
</g></svg>`;

const IC = {
  connect: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  sub: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  tasks: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  ref: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  support: '<path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M21 16v2a4 4 0 0 1-4 4h-5"/>',
  pay: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 15h4"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
};

const SCREENS = {
  main: null,
  connect: { t: 'Подключение', s: 'Одна кнопка, и VPN<br>уже в вашем приложении', ic: 'connect' },
  sub:     { t: 'Моя <em>подписка</em>', s: 'Срок, устройства<br>и продление', ic: 'sub' },
  tasks:   { t: '<em>Задания</em>', s: 'Выполняйте и получайте<br>дни подписки бесплатно', ic: 'tasks', badge: '+7' },
  ref:     { t: 'Пригласи <em>друга</em>', s: '+7 дней вам<br>и другу', ic: 'ref', badge: '+7' },
  info:    { t: 'Информация', s: 'Тарифы, серверы<br>и ответы на вопросы', ic: 'info' },
  support: { t: '<em>Поддержка</em>', s: 'Отвечает человек,<br>а не автоответчик', ic: 'support' },
  pay:     { t: 'Оплата', s: 'СБП, карты и крипта<br>в личном кабинете', ic: 'pay' },
  blocked: { t: 'Доступ <em>ограничен</em>', s: 'Напишите в поддержку,<br>если это ошибка', ic: 'lock' },
};

const key = (location.search.slice(1) || 'main');
const root = document.getElementById('root');
const rings = '<div class="rings"><i></i><i></i><i></i></div>';
if (key === 'main') {
  root.innerHTML = `<div class="b main"><div class="grid"></div>${rings}
    <span class="dot" style="right:330px;top:88px"></span><span class="dot" style="right:120px;top:360px;opacity:.6"></span>
    <div class="logo">${LOGO}</div>
    <div class="copy"><h1>GateX <em>VPN</em></h1>
      <p class="sub">Интернет без стен. Даже на LTE.</p>
      <div class="chips"><span class="chip">Обход белых списков</span><span class="chip">Без лимита трафика</span></div>
    </div></div>`;
} else {
  const s = SCREENS[key];
  root.innerHTML = `<div class="b"><div class="grid"></div>${rings}
    <span class="dot" style="right:190px;top:70px"></span><span class="dot" style="right:560px;top:390px;opacity:.55"></span>
    <div class="brand"><span class="mini">${LOGO}</span><span>GateX <b>VPN</b></span></div>
    <div class="copy"><h1>${s.t}</h1><p class="sub">${s.s}</p></div>
    <div class="tile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="url(#mintS)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[s.ic]}</svg>
      ${s.badge ? `<span class="badge">${s.badge}</span>` : ''}</div></div>`;
}
</script>
</body>
</html>
