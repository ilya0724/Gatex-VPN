<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f14; font-family: "Inter", "Noto Color Emoji", sans-serif; color: #f5f5f5; -webkit-font-smoothing: antialiased; }
.wrap { display: flex; flex-wrap: wrap; width: 1000px; gap: 40px 36px; padding: 36px 22px 40px; align-items: flex-start; }
.col { width: 460px; }
.label { font: 600 22px/1.2 "Unbounded", sans-serif; color: #eaf5f0; margin-bottom: 6px; }
.label small { display: block; font: 500 15px/1.35 "Manrope", sans-serif; color: #8ea89f; margin-top: 6px; min-height: 40px; }
.chat { border-radius: 26px; padding: 16px 10px 14px; background: #0e1621 radial-gradient(circle at 20% 10%, rgba(46,230,166,.05), transparent 50%); border: 1px solid #1c2733; }
.msg { background: #182533; border-radius: 16px 16px 16px 6px; overflow: hidden; }
.msg img { display: block; width: 100%; }
.cap { padding: 9px 12px 8px; font-size: 15.5px; line-height: 1.5; }
.cap b { font-weight: 700; }
.cap .row { display: flex; align-items: center; gap: 7px; }
.cap .row svg { width: 17px; height: 17px; flex: none; }
.cap .gap { height: 7px; }
.cap .muted { color: #8b9aa8; }
.cap .time { text-align: right; font-size: 12.5px; color: #6d7f8f; margin-top: -4px; }
.cap code { font-family: "JetBrains Mono", monospace; font-size: 13.5px; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; color: #7fe3c0; }
.quote { border-left: 3px solid #2ee6a6; background: rgba(46,230,166,.08); border-radius: 4px 8px 8px 4px; padding: 6px 10px; margin: 6px 0 4px; }
.kb { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
.btn { position: relative; grid-column: span 2; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px;
  border-radius: 10px; background: rgba(44, 58, 72, .92); font-size: 15px; font-weight: 600; color: #fff; }
.btn.half { grid-column: span 1; }
.btn.ok { background: #1f9e6e; }
.btn .ext { position: absolute; right: 6px; top: 4px; width: 10px; height: 10px; }
.btn svg.i { width: 18px; height: 18px; }
.note { margin-top: 14px; font: 500 14px/1.45 "Manrope", sans-serif; color: #8ea89f; }
.note b { color: #eaf5f0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="ext" viewBox="0 0 10 10"><path d="M3 1h6v6M9 1 2 8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></symbol>
</defs></svg>
<div class="wrap" id="wrap"></div>
<script>
const I = {
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  phone: '<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  user: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  news: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
};
const svg = (k, c='#fff') => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const ext = '<svg class="ext"><use href="#ext"/></svg>';
const B = (t, o={}) => `<div class="btn${o.half?' half':''}${o.ok?' ok':''}">${o.ic||''}${t}${o.url?ext:''}</div>`;

const status = (icons) => icons ? `
  <div class="row">${svg('zap','#2ee6a6')}<span>Привет, <b>Илья</b></span></div>
  <div class="gap"></div>
  <div class="row">${svg('lock','#2ee6a6')}<span>Активна до <b>26.11.2026</b> · 36 дн.</span></div>
  <div class="row">${svg('phone','#2ee6a6')}<span>Устройства <b>2/7</b></span></div>`
 : `
  <div>⚡ Привет, <b>Илья</b></div>
  <div class="gap"></div>
  <div>🔒 Активна до <b>26.11.2026</b> · 36 дн.</div>
  <div>📱 Устройства <b>2/7</b></div>`;

const mainKb = (icons) => {
  const e = (emo, ic) => icons ? svg(ic) : emo + ' ';
  return `<div class="kb">
    ${B('Подключиться', {ic: e('🔗','link'), url: 1, ok: 1})}
    ${B('Личный кабинет', {ic: e('👤','user'), url: 1})}
    ${B('Задания', {ic: e('⭐','star')})}
    ${B('Друзья', {ic: e('🎁','gift'), half: 1})}${B('Информация', {ic: e('ℹ️','info'), half: 1})}
    ${B('Поддержка', {ic: e('💬','chat'), url: 1, half: 1})}${B('Новости', {ic: e('📢','news'), url: 1, half: 1})}
    ${B('Наш сайт', {ic: e('🌐','globe'), url: 1})}
  </div>`;
};

const COLS = [
  { l: 'Главное меню', s: 'Обычные эмодзи, работает сразу у всех.', img: 'main', cap: status(false), kb: mainKb(false) },
  { l: 'Главное меню, иконки', s: 'Как у Mansur: свои иконки на кнопках. Нужен Telegram Premium у владельца бота.', img: 'main', cap: status(true), kb: mainKb(true) },
  { l: 'Задания', s: 'Пока одно задание. Бот сам проверяет ник и перепроверяет его.', img: 'tasks', cap: `
    <div><b>Задания</b></div>
    <div class="muted">Выполняйте и получайте дни подписки бесплатно.</div>
    <div class="quote"><b>✏️ Ник в Telegram · +7 дней</b><br>Добавьте <code>GateX</code> или <code>@gatexvpn_bot</code> в имя или в «О себе» и нажмите «Проверить».<br><span class="muted">Уберёте ник, 7 дней снимутся.</span></div>
    <div>Статус: ⏳ не выполнено</div>`,
    kb: `<div class="kb">${B('Проверить ник', {ic: '✅ ', ok: 1})}${B('Назад', {ic: '◀️ '})}</div>` },
  { l: 'Друзья', s: 'Текущая рефералка: +7 дней вам и другу. Старая строка «Заработано» убрана.', img: 'ref', cap: `
    <div><b>Пригласите друга</b></div>
    <div class="muted">Друг заходит по вашей ссылке и подписывается на канал. Вы оба получаете +7 дней.</div>
    <div class="quote">Ваша ссылка:<br><code>t.me/gatexvpn_bot?start=ref1054316062</code></div>
    <div>👥 Приглашено: <b>3</b> · 🎁 Получено: <b>21 день</b></div>`,
    kb: `<div class="kb">${B('Поделиться ссылкой', {ic: '📤 ', ok: 1})}${B('Назад', {ic: '◀️ '})}</div>` },
];

document.getElementById('wrap').innerHTML = COLS.map(c => `
  <div class="col">
    <div class="label">${c.l}<small>${c.s}</small></div>
    <div class="chat">
      <div class="msg"><img src="out/${c.img}.png"><div class="cap">${c.cap}<div class="time">23:09</div></div></div>
      ${c.kb}
    </div>
  </div>`).join('');
</script>
</body>
</html>
